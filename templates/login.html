<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Authentication | NeuroMed AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme login-body">
    <div class="cyber-grid"></div>
    <div class="login-container">
        <div class="hologram-card glass-panel">
            <div class="login-header">
                <i class="fa-solid fa-fingerprint pulse-animation"></i>
                <h2>NeuroMed AI</h2>
                <p>System Authentication Required</p>
            </div>
            
            <form action="{{ url_for('login') }}" method="POST" class="login-form">
                {% if error %}
                <div class="alert-item critical" style="margin-bottom: 15px; border-radius: 4px; padding: 10px;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <div class="alert-text">{{ error }}</div>
                </div>
                {% endif %}
                <div class="input-group">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <input type="text" name="username" placeholder="Operator ID" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Passcode" required>
                </div>
                
                <div class="biometric-scan">
                    <div class="scan-line"></div>
                    <i class="fa-solid fa-eye"></i>
                    <span>Retinal Scan Pending...</span>
                </div>
                
                <button type="submit" class="cyber-btn">
                    <span>Initialize Interface</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
            
            <div class="system-status">
                <span class="status-dot online"></span> Secure Connection Active
            </div>
        </div>
    </div>
</body>
</html>
