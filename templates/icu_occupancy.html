{% extends 'base.html' %}

{% block content %}
<div class="dashboard-header">
    <h1><i class="fa-solid fa-bed-pulse pulse-animation"></i> ICU Occupancy Matrix</h1>
</div>

<div class="glass-panel" style="padding: 20px;">
    <div class="chart-header">
        <h3><i class="fa-solid fa-layer-group"></i> Real-time Bed Status</h3>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; margin-top: 20px;">
        <!-- Mock up 16 ICU Beds -->
        {% for i in range(1, 17) %}
        <div class="glass-panel" style="padding: 15px; text-align: center; border: 1px solid {% if loop.index % 3 == 0 %}rgba(255, 0, 60, 0.5){% elif loop.index % 5 == 0 %}rgba(255, 234, 0, 0.5){% else %}rgba(0, 243, 255, 0.5){% endif %};">
            <i class="fa-solid fa-bed" style="font-size: 2rem; color: {% if loop.index % 3 == 0 %}var(--neon-red){% elif loop.index % 5 == 0 %}var(--neon-yellow){% else %}var(--neon-cyan){% endif %}; margin-bottom: 10px;"></i>
            <h4>Bed {{ '%02d' % i }}</h4>
            <p style="font-size: 0.8rem; color: var(--text-muted);">
                {% if loop.index % 3 == 0 %}Occupied{% elif loop.index % 5 == 0 %}Maintenance{% else %}Available{% endif %}
            </p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
